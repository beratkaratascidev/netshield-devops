name: Verify and publish pilot

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  POWERSHELL_TELEMETRY_OPTOUT: '1'

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth python3-tk
          python -m pip install -r requirements-dev.txt
      - name: Python and real Tk tests
        run: xvfb-run -a python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Shared Windows agent core tests
        run: dotnet run --project agents/windows/Core.Tests/Core.Tests.csproj
      - name: Framework compatibility build
        run: dotnet build agents/windows/Core/AgentCore.csproj
      - name: CSharp to HTTPS receiver integration
        run: python scripts/test_agent_core_https.py --dotnet "$(command -v dotnet)"
      - name: Patch whitespace
        run: git diff --check HEAD

  windows-storage:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem agents/windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw "PowerShell syntax error in $($_.Name): $errors" }
          }
      - name: Windows PowerShell 5.1 and real DPAPI smoke
        shell: powershell
        run: '& ./agents/windows/Test-Agent.ps1'

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [linux, windows-storage]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Publish tested source as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          notes="docs/RELEASE_NOTES_${RELEASE_TAG}.md"
          test -f "$notes"
          archive="netshield-${RELEASE_TAG}-source.zip"
          git archive --format=zip --prefix="netshield-${RELEASE_TAG}/" --output="$archive" HEAD
          sha256sum "$archive" > SHA256SUMS
          gh release create "$RELEASE_TAG" "$archive" SHA256SUMS --verify-tag --prerelease --latest=false --title "NetShield ${RELEASE_TAG} — MVP / pilot" --notes-file "$notes"
